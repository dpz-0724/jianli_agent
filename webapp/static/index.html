<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历智能体 · 招聘工作台</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e6e9f0; --line2:#d8dde8;
    --txt:#1d2433; --sub:#5b6472; --mut:#8a93a6;
    --pri:#2f5cff; --pri-d:#1f47d6; --pri-soft:#eef2ff;
    --green:#1a9e6b; --green-soft:#e6f6ef;
    --amber:#c07a10; --amber-soft:#fdf3e2;
    --red:#d0453e; --red-soft:#fceceb;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
    --shadow-lg:0 8px 30px rgba(16,24,40,.12);
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  button{font-family:inherit}

  /* ===== topbar ===== */
  .topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;z-index:60}
  .mark{width:32px;height:32px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700}
  .brand h1{font-size:15px;font-weight:700}
  .brand p{font-size:11px;color:var(--mut)}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
  .on-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

  .layout{display:flex;height:calc(100vh - 56px)}

  /* ===== sidebar ===== */
  .side{width:248px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .side-head{padding:14px 14px 10px}
  .btn-new{width:100%;background:var(--pri);color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn-new:hover{background:var(--pri-d)}
  .btn-home{width:100%;margin-top:8px;background:#fff;border:1px solid var(--line2);color:var(--sub);border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer}
  .btn-home:hover{border-color:var(--pri);color:var(--pri)}

  /* 工作台首页 */
  .dash-funnel{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
  .funnel-cell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s}
  .funnel-cell:hover{border-color:var(--pri);transform:translateY(-1px)}
  .funnel-cell b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .funnel-cell span{font-size:12px;color:var(--mut)}
  .dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
  .follow-item{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid #f0f2f6;cursor:pointer}
  .follow-item:hover{background:#f7f9ff}
  .follow-item:last-child{border-bottom:none}
  .follow-item .fi{flex:1;min-width:0}
  .follow-item .fn{font-weight:600;font-size:13.5px}
  .follow-item .fm{font-size:11.5px;color:var(--mut);margin-top:2px}
  .jobchip{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f0f2f6;cursor:pointer}
  .jobchip:hover{background:#f7f9ff}
  .jobchip:last-child{border-bottom:none}
  .jobchip .jt{font-weight:600;font-size:13.5px}
  .jobchip .jc{margin-left:auto;display:flex;gap:10px;font-size:11.5px;color:var(--mut)}
  .dash-empty{color:var(--mut);text-align:center;padding:36px 0;font-size:13px}
  .side-list{flex:1;overflow-y:auto;padding:4px 8px 16px}
  .side-sec{font-size:11px;color:var(--mut);padding:10px 10px 6px;font-weight:600;letter-spacing:.5px}
  .job-item{padding:11px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
  .job-item:hover{background:#f5f7fb}
  .job-item.on{background:var(--pri-soft);border-color:#c5d4ff}
  .job-item .jt{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .job-item .jt .cnt{margin-left:auto;font-size:11px;color:var(--mut);background:#eef0f5;border-radius:10px;padding:1px 8px}
  .job-item.on .jt .cnt{background:#d3dfff;color:var(--pri)}
  .job-item .js{font-size:11px;color:var(--mut);margin-top:5px;display:flex;gap:8px;align-items:center}
  .mini-run{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite;display:inline-block}
  @keyframes blink{50%{opacity:.25}}
  .dot-p{color:var(--green)}.dot-r{color:var(--amber)}.dot-c{color:var(--red)}
  .side-empty{padding:30px 16px;text-align:center;color:var(--mut);font-size:12px;line-height:1.9}

  /* ===== main ===== */
  .main{flex:1;overflow-y:auto;padding:22px 26px 60px}
  .empty-dash{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut)}
  .empty-dash .big{font-size:44px;margin-bottom:14px;opacity:.35}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
  .card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
  .card h3::before{content:"";width:3px;height:15px;background:var(--pri);border-radius:2px}

  /* job header */
  .job-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .job-head .ttl{font-size:21px;font-weight:700}
  .job-head .sub{color:var(--mut);font-size:12.5px;margin-top:5px}
  .job-head .acts{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .stat-pills{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .sp{background:#f8f9fc;border:1px solid var(--line);border-radius:8px;padding:9px 16px;text-align:center;min-width:78px}
  .sp b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .sp span{font-size:11px;color:var(--mut)}
  .sp.pass b{color:var(--green)}.sp.review b{color:var(--amber)}.sp.conflict b{color:var(--red)}.sp.total b{color:var(--pri)}

  /* buttons */
  .btn{border:1px solid transparent;border-radius:8px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri-d)}.btn-pri:disabled{opacity:.55;cursor:not-allowed}
  .btn-ghost{background:#fff;border-color:var(--line2);color:var(--sub)}.btn-ghost:hover{border-color:var(--pri);color:var(--pri)}
  .btn-danger{background:#fff;border-color:var(--red);color:var(--red)}.btn-danger:hover{background:var(--red-soft)}
  .btn-sm{padding:5px 12px;font-size:12.5px}

  /* profile chips (editable) */
  .prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:14px}
  .pf{background:#f8f9fc;border:1px solid var(--line);border-radius:8px;padding:11px 13px}
  .pf .k{font-size:11.5px;color:var(--mut);margin-bottom:5px}
  .pf .v{font-size:13.5px;font-weight:600}
  .pf input,.pf select{width:100%;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit;background:#fff;outline:none}
  .pf input:focus,.pf select:focus{border-color:var(--pri)}
  .prof-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tag{background:#f1f3f9;border:1px solid var(--line);color:var(--sub);font-size:12px;padding:3px 11px;border-radius:6px}
  .tag.c{background:var(--amber-soft);border-color:#f0dcae;color:var(--amber)}

  /* live panel */
  .live{display:none}
  .live.show{display:block}
  .live-bar{display:flex;align-items:center;gap:12px;cursor:pointer}
  .live-bar .car{margin-left:auto;color:var(--mut);font-size:12px}
  .live-body{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:16px}
  .live.collapsed .live-body{display:none}
  .screen{background:#0d1117;border:1px solid var(--line2);border-radius:8px;overflow:hidden;position:relative;min-height:300px}
  .screen .bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#161b22;border-bottom:1px solid #262d38}
  .screen .bar i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .screen .bar i:nth-child(1){background:#ff5f57}.screen .bar i:nth-child(2){background:#febc2e}.screen .bar i:nth-child(3){background:#28c840}
  .screen .bar span{margin-left:8px;font-size:11.5px;color:#9aa4b2;display:flex;align-items:center;gap:6px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#ff5f57;animation:blink 1.3s infinite}
  .screen img{width:100%;display:block;min-height:250px;object-fit:contain;background:#000}
  .screen .empty{position:absolute;inset:42px 0 0;display:grid;place-items:center;font-size:12.5px;text-align:center;line-height:2;color:#8b949e}
  .spin{width:26px;height:26px;border:3px solid #2d333b;border-top-color:var(--pri);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto 10px}
  @keyframes rot{to{transform:rotate(360deg)}}
  .loginmask{display:none;position:absolute;inset:42px 0 0;background:rgba(13,17,23,.94);place-items:center;text-align:center;z-index:5}
  .loginmask.show{display:grid}
  .loginmask p{color:var(--amber);font-size:14px;margin-bottom:14px;font-weight:600}
  .pignum{display:flex;align-items:baseline;gap:8px;margin:4px 0 11px}
  .pignum .big{font-size:40px;font-weight:700;color:var(--pri);line-height:1;font-variant-numeric:tabular-nums}
  .pignum .of{color:var(--mut);font-size:14px}
  .progress{height:7px;background:#e9ecf2;border-radius:99px;overflow:hidden}
  .progress i{display:block;height:100%;border-radius:99px;background:var(--pri);width:0;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .logline{margin-top:13px;font-size:12.5px;color:var(--sub);background:#f8f9fc;border:1px dashed var(--line2);border-radius:8px;padding:9px 13px;display:flex;gap:8px;align-items:center;min-height:38px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--pri);animation:blink 1.1s infinite;flex-shrink:0}

  /* ===== candidate toolbar ===== */
  .cand-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .tabs{display:flex;gap:5px;background:#eef0f5;border-radius:8px;padding:3px}
  .tab{border:none;background:transparent;color:var(--sub);font-size:12.5px;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600}
  .tab.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .search-box{position:relative}
  .search-box input{border:1px solid var(--line2);border-radius:8px;padding:8px 12px 8px 32px;font-size:13px;width:200px;outline:none;background:#fff}
  .search-box input:focus{border-color:var(--pri)}
  .search-box::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:15px}
  select.fl{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:var(--sub);outline:none;cursor:pointer}
  .tb-right{margin-left:auto;display:flex;gap:9px;align-items:center}

  /* ===== candidate table ===== */
  .tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{background:#f8f9fc;color:var(--sub);font-weight:600;font-size:12px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--pri)}
  thead th .arr{color:var(--pri);font-size:10px}
  tbody td{padding:11px 12px;border-bottom:1px solid #f0f2f6;vertical-align:middle;white-space:nowrap}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#f7f9ff;cursor:pointer}
  tbody tr.selected{background:var(--pri-soft)}
  tbody tr.dim{opacity:.5}
  .nm-cell{display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
  .av-g{background:var(--green)}.av-a{background:var(--amber)}.av-r{background:var(--red)}.av-n{background:#8a93a6}
  .nm-cell .n{font-weight:600}
  .nm-cell .t{font-size:11px;color:var(--mut);margin-top:1px}
  .score-badge{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:26px;border-radius:13px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
  .sc-g{background:var(--green-soft);color:var(--green)}.sc-a{background:var(--amber-soft);color:var(--amber)}.sc-r{background:var(--red-soft);color:var(--red)}
  .stag{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:600;white-space:nowrap}
  .stag.PASS{background:var(--green-soft);color:var(--green)}
  .stag.REVIEW{background:var(--amber-soft);color:var(--amber)}
  .stag.CONFLICT{background:var(--red-soft);color:var(--red)}
  select.stage-sel{border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-size:12px;background:#fff;color:var(--sub);cursor:pointer;outline:none}
  select.stage-sel.ST-CONTACTED{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
  select.stage-sel.ST-INTERVIEW{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  select.stage-sel.ST-REJECTED{border-color:var(--red);color:var(--red);background:var(--red-soft)}
  select.stage-sel.ST-TALENT_POOL{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
  .mut{color:var(--mut)}
  .row-actions{display:flex;gap:5px}
  .icon-btn{width:28px;height:28px;border:1px solid var(--line2);background:#fff;border-radius:6px;cursor:pointer;font-size:13px;display:grid;place-items:center;color:var(--sub)}
  .icon-btn:hover{border-color:var(--pri);color:var(--pri)}
  .icon-btn.faved{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
  .empty-tbl{padding:60px 0;text-align:center;color:var(--mut);font-size:13px}

  /* batch bar */
  .batch-bar{position:sticky;bottom:16px;background:#1d2433;color:#fff;border-radius:10px;padding:11px 18px;display:none;align-items:center;gap:14px;box-shadow:var(--shadow-lg);z-index:20;margin-top:14px}
  .batch-bar.show{display:flex}
  .batch-bar .n{font-weight:700}
  .batch-bar .btn{padding:6px 14px;font-size:12.5px}
  .batch-bar .bb{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
  .batch-bar .bb:hover{background:rgba(255,255,255,.22)}
  .batch-bar .bb.danger{background:var(--red);color:#fff}

  /* ===== detail drawer ===== */
  .drawer-mask{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:80;display:none}
  .drawer-mask.show{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:94vw;background:#fff;box-shadow:-8px 0 40px rgba(16,24,40,.18);z-index:81;transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px}
  .drawer-head .avatar{width:46px;height:46px;font-size:18px}
  .drawer-head .n{font-size:17px;font-weight:700}
  .drawer-head .t{font-size:12px;color:var(--mut);margin-top:2px}
  .drawer-close{margin-left:auto;border:none;background:#f0f2f6;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--sub)}
  .drawer-body{flex:1;overflow-y:auto;padding:20px 22px}
  .dsec{margin-bottom:22px}
  .dsec h4{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .dsec h4::before{content:"";width:3px;height:12px;background:var(--pri);border-radius:2px}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .kv .item{background:#f8f9fc;border:1px solid var(--line);border-radius:7px;padding:9px 12px}
  .kv .item .k{font-size:11px;color:var(--mut)}
  .kv .item .v{font-size:13px;font-weight:600;margin-top:2px}
  .score-box{display:flex;align-items:center;gap:16px;background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .score-box .ring{position:relative;width:64px;height:64px;flex-shrink:0}
  .score-box .ring svg{transform:rotate(-90deg)}
  .score-box .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px}
  .score-box .ring .num small{font-size:9px;color:var(--mut);font-weight:400}
  .score-break{flex:1;font-size:12px;color:var(--sub);line-height:1.9}
  .score-break .bhit{color:var(--green)}
  .score-break .bmiss{color:var(--mut)}
  .reason-list{font-size:12.5px;line-height:1.9}
  .reason-list li{margin-left:18px;margin-bottom:3px;color:var(--sub)}
  .reason-list li.pos{color:var(--txt)}
  .reason-list li.neg{color:var(--red)}
  .stage-btns{display:flex;flex-wrap:wrap;gap:8px}
  .stage-btn{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:8px 14px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--sub)}
  .stage-btn:hover{border-color:var(--pri);color:var(--pri)}
  .stage-btn.cur{background:var(--pri);color:#fff;border-color:var(--pri)}
  .note-area{width:100%;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;min-height:70px;resize:vertical;outline:none}
  .note-area:focus{border-color:var(--pri)}
  .timeline{font-size:12px;color:var(--mut);line-height:1.9}
  .timeline .ti{padding:5px 0;border-left:2px solid var(--line);padding-left:12px;position:relative}
  .timeline .ti::before{content:"";position:absolute;left:-4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--line2)}

  /* 完整简历 */
  .resume-full{background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:14px 16px;max-height:none}
  .rsec{margin-bottom:16px}
  .rsec:last-child{margin-bottom:0}
  .rsec-t{font-size:13px;font-weight:700;color:var(--pri);margin-bottom:7px;padding-left:9px;border-left:3px solid var(--pri);line-height:1.2}
  .rline{font-size:13px;color:var(--txt);line-height:1.75;padding:1px 0}
  .rline.em{color:var(--mut);font-size:12px}
  /* 工作经历时间线卡片 */
  .work-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:8px;padding:11px 13px;margin-bottom:10px}
  .work-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .work-co{font-size:13.5px;font-weight:700}
  .work-period{margin-left:auto;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .work-title{font-size:12.5px;color:var(--pri);font-weight:600;margin-top:2px}
  .work-desc{font-size:12.5px;color:var(--sub);line-height:1.75;margin-top:6px}

  /* ===== modal ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:90;display:none;place-items:center}
  .modal-mask.show{display:grid}
  .modal{background:#fff;border-radius:14px;width:640px;max-width:94vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:26px 28px}
  .modal h3{font-size:17px;font-weight:700;margin-bottom:4px}
  .modal .hint{color:var(--mut);font-size:13px;margin-bottom:18px}
  .modal label{display:block;font-size:13px;color:var(--sub);margin:15px 0 6px;font-weight:600}
  .modal label small{color:var(--mut);font-weight:400}
  .modal input,.modal textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
  .modal input:focus,.modal textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,92,255,.12)}
  .modal textarea{min-height:120px;resize:vertical;line-height:1.7}
  .modal .btnrow{display:flex;gap:11px;margin-top:22px;justify-content:flex-end}

  .toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-12px);background:#1d2433;color:#fff;padding:11px 22px;border-radius:8px;box-shadow:var(--shadow-lg);z-index:99;opacity:0;transition:all .25s;font-size:13px;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:1000px){.side{width:200px}.live-body{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="topbar">
  <div class="mark">简</div>
  <div class="brand"><h1>简历智能体</h1><p>智联招聘候选人筛选工作台</p></div>
  <div class="top-right"><span class="on-dot"></span>智联数据源已连接</div>
</div>

<div class="layout">
  <!-- sidebar -->
  <aside class="side">
    <div class="side-head">
      <button class="btn-new" onclick="openCreate()">＋ 新建岗位</button>
      <button class="btn-home" id="homeBtn" onclick="showDashboard()">▦ 工作台</button>
    </div>
    <div class="side-list" id="sideList"></div>
  </aside>

  <!-- main -->
  <main class="main" id="main">
    <div id="dashView"></div>
    <div id="jobView" style="display:none"></div>
  </main>
</div>

<!-- create modal -->
<div class="modal-mask" id="createMask">
  <div class="modal">
    <h3>新建招聘岗位</h3>
    <p class="hint">粘贴岗位 JD 或描述用人需求，系统自动解析出筛选标准（技能/学历/经验/证书/年龄/城市）。</p>
    <label>岗位名称 <small style="color:var(--red)">*</small></label>
    <input id="cTitle" placeholder="例如：销售经理 / Java 后端工程师">
    <label>检索关键词 <small>（可选，留空由系统生成）</small></label>
    <input id="cKw" placeholder="例如：销售 / Java">
    <label>岗位描述 / 用人需求 <small style="color:var(--red)">*</small></label>
    <textarea id="cJd" placeholder="例如：&#10;销售经理，大专以上学历，1-3年经验，35岁以下，持驾照及英语四级优先，薪资8-12K，工作地点上海。"></textarea>
    <div class="btnrow">
      <button class="btn btn-ghost" onclick="fillDemo()">填充示例</button>
      <button class="btn btn-ghost" onclick="closeCreate()">取消</button>
      <button class="btn btn-pri" id="btnCreate" onclick="doCreate()">解析并创建</button>
    </div>
  </div>
</div>

<!-- detail drawer -->
<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<script>
// ================= state =================
let jobs = [];
let curJobId = null;
let curJob = null;
let candidates = [];
let selected = new Set();
let filters = {status:"ALL", stage:"ALL", search:"", education:"", activity:"", sort:"score", order:"desc"};
let runTimer = null, picTimer = null, pollTimer = null;
let running = false;

const $ = id => document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
async function api(url,opts){const r=await fetch(url,opts);if(r.status===200&&r.headers.get('content-type')?.includes('csv'))return r;return r.json()}
const STAGE_CN={NEW:"新入库",TO_REVIEW:"待评估",TO_CONTACT:"待联系",CONTACTED:"已联系",INTERVIEW:"约面",OFFER:"已发offer",HIRED:"已入职",REJECTED:"已淘汰",TALENT_POOL:"人才库"};
const STATUS_CN={PASS:"匹配",REVIEW:"待复核",CONFLICT:"不符"};

// ================= init =================
async function init(){
  await loadJobs();
  showDashboard();
}
async function loadJobs(){
  const r = await api('/api/jobs');
  jobs = r.jobs||[];
  renderSidebar();
}

// ================= 工作台首页 =================
function showDashboard(){
  curJobId=null; stopPolling();
  $('jobView').style.display='none';
  $('dashView').style.display='block';
  renderSidebar();
  api('/api/dashboard').then(r=>{ if(r.ok) renderDashboard(r); });
}
function renderDashboard(d){
  const sc=d.stage_counts||{};
  const cell=(n,label,color,stage)=>`<div class="funnel-cell" onclick="filterStage('${stage}')" ><b style="color:${color}">${n}</b><span>${label}</span></div>`;
  const follow=d.follow_ups||[];
  const today=new Date().toISOString().slice(0,10);
  const followHtml = follow.length ? follow.map(f=>{
    const due=f.next_follow_up_at||'';
    const overdue = due && due<=today;
    return `<div class="follow-item" onclick="openCandidateFromDash(${f.job_id},${f.job_candidate_id})">
      <div class="avatar ${avClass(f.assessment_status)}">${(f.name||'?')[0]}</div>
      <div class="fi"><div class="fn">${f.name} <span class="mut" style="font-weight:400">${f.title||''}</span></div>
        <div class="fm">${f.job_title} · ${f.location||''} · ${f.education||''}${f.age?(' · '+f.age+'岁'):''}</div></div>
      ${due?`<span class="stag" style="background:${overdue?'var(--red-soft)':'#eef0f5'};color:${overdue?'var(--red)':'var(--sub)'}">${overdue?'⚠ ':''}${due.slice(5)}跟进</span>`:''}
      <span class="stag ${f.assessment_status}">${STATUS_CN[f.assessment_status]||''}</span>
      <span class="stag" style="background:var(--pri-soft);color:var(--pri)">${STAGE_CN[f.stage]||f.stage}</span>
    </div>`;
  }).join('') : '<div class="dash-empty">暂无待跟进的候选人<br><span style="font-size:12px">在岗位里把候选人标为「待联系/约面」后会出现在这里</span></div>';
  const jobHtml = (d.jobs||[]).map(j=>`<div class="jobchip" onclick="selectJob(${j.id})">
      <div class="jt">${j.title}</div>
      <div class="jc"><span>${j.cnt} 候选</span>${j.to_contact?`<span class="dot-r">待联系${j.to_contact}</span>`:''}${j.interview?`<span class="dot-p">约面${j.interview}</span>`:''}</div>
    </div>`).join('') || '<div class="dash-empty">还没有岗位</div>';
  $('dashView').innerHTML=`
    <div class="dash-funnel">
      ${cell(d.total||0,'候选池','var(--pri)','ALL')}
      ${cell(sc.TO_REVIEW||0,'待评估','var(--sub)','TO_REVIEW')}
      ${cell(sc.TO_CONTACT||0,'待联系','var(--amber)','TO_CONTACT')}
      ${cell(sc.CONTACTED||0,'已联系','#7a5af5','CONTACTED')}
      ${cell(sc.INTERVIEW||0,'约面','var(--green)','INTERVIEW')}
      ${cell(sc.TALENT_POOL||0,'人才库','var(--amber)','TALENT_POOL')}
    </div>
    <div class="dash-grid">
      <div class="card" style="margin:0"><h3>今日该跟进</h3><div style="margin-top:10px">${followHtml}</div></div>
      <div class="card" style="margin:0"><h3>岗位概览</h3><div style="margin-top:10px">${jobHtml}</div></div>
    </div>`;
}
function filterStage(stage){
  // 跳到第一个有该阶段候选人的岗位，并套用筛选
  if(jobs.length){ selectJob(jobs[0].id).then(()=>{ if(stage!=='ALL'){ const st=document.querySelector('#stageTab'); if(st){st.value=stage; setStage(stage);} } }); }
}
async function openCandidateFromDash(jobId, jcid){
  await selectJob(jobId);
  openDrawer(jcid);
}
function renderSidebar(){
  const el=$('sideList');
  if(!jobs.length){el.innerHTML='<div class="side-empty">还没有岗位<br>点击上方「新建岗位」开始</div>';return}
  el.innerHTML='<div class="side-sec">我的岗位（'+jobs.length+'）</div>'+jobs.map(j=>{
    const run = (j.status==='RUNNING'||j.status==='NEED_LOGIN');
    return `<div class="job-item ${j.id===curJobId?'on':''}" onclick="selectJob(${j.id})">
      <div class="jt">${run?'<span class="mini-run"></span>':''}${j.title}<span class="cnt">${j.candidate_count}</span></div>
      <div class="js"><span class="dot-p">${j.pass} 匹配</span><span class="dot-r">${j.review} 待复核</span></div>
    </div>`;
  }).join('');
}

// ================= job view =================
async function selectJob(id){
  curJobId=id; selected.clear();
  renderSidebar();
  const r = await api(`/api/jobs/${id}`);
  if(!r.ok){toast(r.error||'加载失败');return}
  curJob = r.job;
  renderJobView();
  await loadCandidates();
  // 若该岗位正在运行，接管轮询
  if(curJob.run_status==='RUNNING'||curJob.run_status==='NEED_LOGIN'){ startPolling(); } else { stopPolling(); }
}

function renderJobView(){
  $('dashView').style.display='none';
  $('jobView').style.display='block';
  const j=curJob, p=j.profile, s=j.stats;
  const activeRun = (j.run_status==='RUNNING'||j.run_status==='NEED_LOGIN');
  $('jobView').innerHTML=`
    <div class="card">
      <div class="job-head">
        <div>
          <div class="ttl">${j.title}</div>
          <div class="sub">创建于 ${String(j.created_at||'').slice(0,10)} · 检索关键词：${p.keyword||j.keyword||j.title}</div>
        </div>
        <div class="acts">
          <button class="btn btn-ghost" onclick="openReport()">⎙ 推荐报告</button>
          <button class="btn btn-ghost" onclick="exportJob()">⭳ 导出 Excel</button>
          ${activeRun
            ? '<button class="btn btn-danger" onclick="doStop()">停止本轮</button>'
            : `<span style="display:inline-flex;align-items:center;gap:8px;background:#f8f9fc;border:1px solid var(--line);border-radius:8px;padding:6px 12px">
                 <input id="targetN" type="number" value="60" min="10" max="500" style="width:60px;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:13px"> <span style="font-size:12px;color:var(--mut)">人</span>
                 <label style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);cursor:pointer;margin-left:6px" title="逐人打开完整简历读取工作经历/项目/证书，匹配更准；但消耗智联账号的每日简历查看额度"><input type="checkbox" id="deepMode" style="accent-color:var(--pri)"> 深度读简历</label>
                 <input id="detailN" type="number" value="20" min="1" max="50" style="width:52px;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:13px" title="深读人数上限（省额度）"> <span style="font-size:11px;color:var(--mut)">份</span>
               </span>
               <button class="btn btn-pri" onclick="startRecruit()">▶ 开始筛选</button>`}
        </div>
      </div>
      <div class="stat-pills">
        <div class="sp total"><b>${s.total}</b><span>候选池</span></div>
        <div class="sp pass"><b>${s.pass}</b><span>匹配</span></div>
        <div class="sp review"><b>${s.review}</b><span>待复核</span></div>
        <div class="sp conflict"><b>${s.conflict}</b><span>不符</span></div>
      </div>
    </div>

    <div class="card">
      <h3>用人标准 <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="toggleProfEdit()">编辑</button></h3>
      <div id="profView"></div>
      <div id="profEdit" style="display:none"></div>
    </div>

    <div class="card live ${activeRun?'show':''}" id="liveCard">
      <div class="live-bar" onclick="toggleLive()">
        <h3 style="margin:0">实时筛选画面</h3>
        <span class="car" id="liveCar">▾ 收起</span>
      </div>
      <div class="live-body">
        <div class="screen">
          <div class="bar"><i></i><i></i><i></i><span><span class="live-dot"></span>智联检索实时画面</span></div>
          <img id="pv" alt="">
          <div class="empty" id="pvEmpty"><div><div class="spin"></div>正在启动检索…</div></div>
          <div class="loginmask" id="loginMask"><div><p>需要登录智联招聘</p><button class="btn btn-pri" onclick="event.stopPropagation();showLogin()">弹出浏览器扫码登录</button></div></div>
        </div>
        <div>
          <div class="pignum"><span class="big" id="nFound">0</span><span class="of">/ <span id="nTarget">${s.total||100}</span> 人</span></div>
          <div class="progress"><i id="pbar"></i></div>
          <div class="logline"><span class="pulse"></span><span id="logMsg">准备中…</span></div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:16px 18px 18px">
      <div class="cand-toolbar">
        <div class="tabs" id="statusTabs">
          <button class="tab on" data-v="ALL">全部</button>
          <button class="tab" data-v="PASS">匹配</button>
          <button class="tab" data-v="REVIEW">待复核</button>
          <button class="tab" data-v="CONFLICT">不符</button>
        </div>
        <select class="fl" id="stageTab" onchange="setStage(this.value)">
          <option value="ALL">全部招聘状态</option>
          <option value="TALENT_POOL">人才库(收藏)</option>
          <option value="TO_CONTACT">待联系</option>
          <option value="CONTACTED">已联系</option>
          <option value="INTERVIEW">约面</option>
          <option value="REJECTED">已淘汰</option>
        </select>
        <select class="fl" id="eduTab" onchange="setEdu(this.value)">
          <option value="">全部学历</option><option>大专</option><option>本科</option><option>硕士</option><option>博士</option>
        </select>
        <select class="fl" id="actTab" onchange="setAct(this.value)">
          <option value="">全部活跃度</option><option>在线</option><option>刚刚活跃</option><option>今日活跃</option><option>本周活跃</option>
        </select>
        <div class="search-box"><input id="searchBox" placeholder="搜索姓名/职位/技能" oninput="debSearch(this.value)"></div>
        <div class="tb-right">
          <span class="mut" id="candTotal" style="font-size:12.5px"></span>
        </div>
      </div>
      <div class="tbl-wrap"><div id="candArea"></div></div>
      <div class="batch-bar" id="batchBar">
        <span>已选 <span class="n" id="selN">0</span> 人</span>
        <button class="bb" onclick="batchStage('TALENT_POOL')">收藏</button>
        <button class="bb" onclick="batchStage('TO_CONTACT')">标记待联系</button>
        <button class="bb" onclick="batchStage('CONTACTED')">标记已联系</button>
        <button class="bb" onclick="batchStage('INTERVIEW')">约面</button>
        <button class="bb danger" onclick="batchStage('REJECTED')">淘汰</button>
        <button class="bb" style="margin-left:auto" onclick="clearSel()">取消选择</button>
      </div>
    </div>
  `;
  renderProfile();
  bindTabs();
}

function renderProfile(){
  const p=curJob.profile;
  $('profView').innerHTML=`
    <div class="prof-grid">
      <div class="pf"><div class="k">最低学历</div><div class="v">${p.min_education||'不限'}</div></div>
      <div class="pf"><div class="k">最低经验</div><div class="v">${p.min_experience_years?p.min_experience_years+'年':'不限'}</div></div>
      <div class="pf"><div class="k">年龄要求</div><div class="v">${p.age_max?((p.age_min?p.age_min+'-':'≤')+p.age_max+'岁'):'不限'}</div></div>
      <div class="pf"><div class="k">薪资预算</div><div class="v">${p.salary_max?((p.salary_min||'')+'-'+p.salary_max+'K'):'不限'}</div></div>
      <div class="pf"><div class="k">检索关键词</div><div class="v">${p.keyword||'—'}</div></div>
      <div class="pf"><div class="k">工作城市</div><div class="v">${(p.locations||[]).join(' / ')||'不限'}</div></div>
    </div>
    ${(p.required_skills&&p.required_skills.length)?'<div style="margin-top:12px;font-size:12px;color:var(--mut)">必备技能</div><div class="prof-tags">'+p.required_skills.map(s=>`<span class="tag">${s}</span>`).join('')+'</div>':''}
    ${(p.certificates&&p.certificates.length)?'<div style="margin-top:10px;font-size:12px;color:var(--mut)">证书要求</div><div class="prof-tags">'+p.certificates.map(s=>`<span class="tag c">${s}</span>`).join('')+'</div>':''}
  `;
  // edit form
  $('profEdit').innerHTML=`
    <div class="prof-grid">
      <div class="pf"><div class="k">检索关键词</div><input id="e_kw" value="${p.keyword||''}"></div>
      <div class="pf"><div class="k">最低学历</div><select id="e_edu">
        ${['','大专','本科','硕士'].map(e=>`<option value="${e}" ${p.min_education===e?'selected':''}>${e||'不限'}</option>`).join('')}</select></div>
      <div class="pf"><div class="k">最低经验(年)</div><input id="e_exp" type="number" value="${p.min_experience_years||0}" min="0"></div>
      <div class="pf"><div class="k">年龄上限</div><input id="e_age" type="number" value="${p.age_max||''}" placeholder="不限"></div>
      <div class="pf"><div class="k">薪资预算下限(K)</div><input id="e_smin" type="number" value="${p.salary_min||''}" placeholder="不限"></div>
      <div class="pf"><div class="k">薪资预算上限(K)</div><input id="e_smax" type="number" value="${p.salary_max||''}" placeholder="不限"></div>
      <div class="pf"><div class="k">工作城市(逗号分隔)</div><input id="e_loc" value="${(p.locations||[]).join(',')}"></div>
      <div class="pf"><div class="k">证书要求(逗号分隔)</div><input id="e_cert" value="${(p.certificates||[]).join(',')}"></div>
    </div>
    <div class="btnrow" style="display:flex;gap:11px;margin-top:16px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="toggleProfEdit()">取消</button>
      <button class="btn btn-pri btn-sm" onclick="saveProfile()">保存并重算</button>
    </div>
  `;
}
function toggleProfEdit(){
  const e=$('profEdit'),v=$('profView');
  const show = e.style.display==='none';
  e.style.display=show?'block':'none'; v.style.display=show?'none':'block';
}
async function saveProfile(){
  const body={
    keyword:$('e_kw').value.trim(),
    min_education:$('e_edu').value,
    min_experience_years:parseInt($('e_exp').value||'0'),
    age_max:$('e_age').value?parseInt($('e_age').value):0,
    salary_min:$('e_smin').value?parseInt($('e_smin').value):0,
    salary_max:$('e_smax').value?parseInt($('e_smax').value):0,
    locations:$('e_loc').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    certificates:$('e_cert').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
  };
  const r=await api(`/api/jobs/${curJobId}/profile`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){toast(r.error||'保存失败');return}
  toast('用人标准已更新，正在重算…');
  toggleProfEdit();
  const j=await api(`/api/jobs/${curJobId}`); curJob=j.job;
  renderProfile(); renderJobHeaderStats(); await loadCandidates();
}
function renderJobHeaderStats(){
  // 重新拉一次岗位详情刷新统计
  api(`/api/jobs/${curJobId}`).then(r=>{ if(r.ok){curJob=r.job; selectJobRefreshHeader(); }});
}
function selectJobRefreshHeader(){ renderSidebar(); }

// ================= candidates =================
function bindTabs(){
  document.querySelectorAll('#statusTabs .tab').forEach(t=>{
    t.onclick=()=>{document.querySelectorAll('#statusTabs .tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');filters.status=t.dataset.v;loadCandidates()};
  });
}
function setStage(v){filters.stage=v;loadCandidates()}
function setEdu(v){filters.education=v;loadCandidates()}
function setAct(v){filters.activity=v;loadCandidates()}
let _st=null;
function debSearch(v){clearTimeout(_st);_st=setTimeout(()=>{filters.search=v;loadCandidates()},350)}
function setSort(col){
  if(filters.sort===col){filters.order=filters.order==='desc'?'asc':'desc'}
  else{filters.sort=col;filters.order='desc'}
  loadCandidates();
}

async function loadCandidates(){
  if(!curJobId)return;
  const q=new URLSearchParams({status:filters.status,stage:filters.stage,search:filters.search,education:filters.education,activity:filters.activity,sort:filters.sort,order:filters.order,limit:1000});
  const r=await api(`/api/jobs/${curJobId}/candidates?`+q);
  candidates=r.candidates||[];
  $('candTotal').textContent=`共 ${r.total??candidates.length} 人`;
  renderCandidates();
  updateBatchBar();
}

function scoreClass(s){return s>=60?'sc-g':s>=40?'sc-a':'sc-r'}
function avClass(st){return st==='PASS'?'av-g':st==='REVIEW'?'av-a':st==='CONFLICT'?'av-r':'av-n'}

function renderCandidates(){
  const el=$('candArea');
  if(!candidates.length){el.innerHTML='<div class="empty-tbl">当前条件下暂无候选人<br><span style="font-size:12px">点击右上角「开始筛选」检索智联候选人</span></div>';return}
  const arr=(c)=>(filters.sort===c?`<span class="arr">${filters.order==='desc'?'▼':'▲'}</span>`:'');
  let html=`<table><thead><tr>
    <th style="width:34px"><input type="checkbox" id="selAll" onchange="toggleAll(this.checked)"></th>
    <th>候选人</th>
    <th class="sortable" onclick="setSort('score')">匹配分 ${arr('score')}</th>
    <th>结论</th>
    <th>城市</th>
    <th class="sortable" onclick="setSort('education')">学历 ${arr('education')}</th>
    <th>经验</th>
    <th class="sortable" onclick="setSort('age')">年龄 ${arr('age')}</th>
    <th class="sortable" onclick="setSort('salary')">期望薪资 ${arr('salary')}</th>
    <th>在职状态</th>
    <th>招聘状态</th>
    <th style="width:70px">操作</th>
  </tr></thead><tbody>`;
  html+=candidates.map(c=>{
    const sel=selected.has(c.id);
    const dim = c.stage==='REJECTED'?'dim':'';
    return `<tr class="${sel?'selected':''} ${dim}" onclick="openDrawer(${c.id})">
      <td onclick="event.stopPropagation()"><input type="checkbox" ${sel?'checked':''} onchange="toggleSel(${c.id},this.checked)"></td>
      <td><div class="nm-cell"><div class="avatar ${avClass(c.status)}">${(c.name||'?')[0]}</div>
        <div><div class="n">${c.name}</div><div class="t">${c.title||'—'}</div></div></div></td>
      <td><span class="score-badge ${scoreClass(c.score)}">${c.score}</span></td>
      <td><span class="stag ${c.status}">${STATUS_CN[c.status]||c.status}</span></td>
      <td>${c.location||'—'}</td>
      <td>${c.education||'—'}</td>
      <td class="mut">${c.experience||'—'}</td>
      <td>${c.age?c.age+'岁':'—'}</td>
      <td class="mut">${c.salary||'—'}</td>
      <td class="mut" style="font-size:12px">${c.activity||'—'}</td>
      <td onclick="event.stopPropagation()">${stageSelect(c)}</td>
      <td onclick="event.stopPropagation()"><div class="row-actions">
        <button class="icon-btn ${c.stage==='TALENT_POOL'?'faved':''}" title="收藏" onclick="setCandidateStage(${c.id},'TALENT_POOL')">★</button>
        <button class="icon-btn" title="详情" onclick="openDrawer(${c.id})">›</button>
      </div></td>
    </tr>`;
  }).join('');
  html+='</tbody></table>';
  el.innerHTML=html;
  const sa=$('selAll'); if(sa) sa.checked = candidates.length>0 && candidates.every(c=>selected.has(c.id));
}

function stageSelect(c){
  const opts=['TO_REVIEW','TALENT_POOL','TO_CONTACT','CONTACTED','INTERVIEW','REJECTED'];
  return `<select class="stage-sel ST-${c.stage}" onchange="setCandidateStage(${c.id},this.value)">
    ${opts.map(o=>`<option value="${o}" ${c.stage===o?'selected':''}>${STAGE_CN[o]}</option>`).join('')}
  </select>`;
}

async function setCandidateStage(id,stage){
  await api(`/api/candidates/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage})});
  const c=candidates.find(x=>x.id===id); if(c)c.stage=stage;
  renderCandidates(); loadJobs();
}
function toggleSel(id,on){ if(on)selected.add(id);else selected.delete(id); updateBatchBar(); const sa=$('selAll'); if(sa)sa.checked=candidates.every(c=>selected.has(c.id)); 
  document.querySelectorAll('#candArea tbody tr').forEach((tr,i)=>{ if(candidates[i]) tr.classList.toggle('selected',selected.has(candidates[i].id)); }); }
function toggleAll(on){ selected = on? new Set(candidates.map(c=>c.id)) : new Set(); renderCandidates(); updateBatchBar(); }
function clearSel(){ selected.clear(); renderCandidates(); updateBatchBar(); }
function updateBatchBar(){ const bb=$('batchBar'); if(!bb)return; bb.classList.toggle('show',selected.size>0); $('selN').textContent=selected.size; }
async function batchStage(stage){
  const ids=[...selected];
  for(const id of ids){ await api(`/api/candidates/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage})}); const c=candidates.find(x=>x.id===id); if(c)c.stage=stage; }
  toast(`已批量更新 ${ids.length} 人`);
  clearSel(); loadJobs();
}

// ================= recruit / polling =================
async function startRecruit(){
  const target = parseInt($('targetN')?.value||'60');
  const deep = $('deepMode')?.checked ?? false;
  const detailN = parseInt($('detailN')?.value||'20');
  const r=await api(`/api/jobs/${curJobId}/start`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_count:target,fetch_detail:deep,max_detail:detailN})});
  if(!r.ok){toast(r.error||'启动失败');return}
  toast(deep?`已开始筛选（深度读前${detailN}份简历）`:'已开始筛选');
  $('nTarget').textContent=target;
  const lc=$('liveCard'); lc.classList.add('show'); lc.classList.remove('collapsed'); $('liveCar').textContent='▾ 收起';
  running=true; startPolling();
  renderJobView(); // 刷新头按钮为"停止"
  $('liveCard').classList.add('show'); $('liveCard').classList.remove('collapsed');
}
function toggleLive(){ const lc=$('liveCard'); lc.classList.toggle('collapsed'); $('liveCar').textContent=lc.classList.contains('collapsed')?'▸ 展开':'▾ 收起'; }
function startPolling(){ stopPolling(); running=true; runTimer=setInterval(pollStatus,1500); picTimer=setInterval(refreshPic,1800); pollTimer=setInterval(loadCandidates,3000); refreshPic(); }
function stopPolling(){ running=false; [runTimer,picTimer,pollTimer].forEach(t=>t&&clearInterval(t)); }
function refreshPic(){ const img=$('pv'); if(!img)return; img.src='/api/preview.png?t='+Date.now(); img.onload=()=>{const e=$('pvEmpty'); if(e)e.style.display='none'}; }

async function pollStatus(){
  if(!curJobId)return;
  const r=await api(`/api/jobs/${curJobId}/status`); const s=r.state;
  const nf=$('nFound'); if(nf)nf.textContent=s.found||0;
  const lm=$('logMsg'); if(lm)lm.textContent=s.message||'运行中…';
  const tgt=s.target||parseInt($('nTarget')?.textContent)||100;
  const pb=$('pbar'); if(pb)pb.style.width=(s.status==='SUCCEEDED'?100:Math.min(100,Math.round((s.found||0)/tgt*100)))+'%';
  const lmk=$('loginMask'); if(lmk)lmk.classList.toggle('show',!!s.need_login);
  if(s.finished){
    stopPolling();
    if(s.status==='SUCCEEDED')toast(`本轮完成，共 ${s.found} 名候选人`);
    else if(s.status==='FAILED')toast('任务异常：'+(s.error||''));
    await loadJobs(); const j=await api(`/api/jobs/${curJobId}`); if(j.ok){curJob=j.job;renderJobView();await loadCandidates();}
  }
}
async function doStop(){ await api(`/api/jobs/${curJobId}/stop`,{method:'POST'}); toast('已发送停止'); }
async function showLogin(){ await api(`/api/jobs/${curJobId}/login_shown`,{method:'POST'}); toast('浏览器已弹出，请扫码登录'); }

// ================= export =================
function exportJob(){ if(!curJobId)return; window.open(`/api/jobs/${curJobId}/export`,'_blank'); toast('正在导出 Excel…'); }
function openReport(){ if(!curJobId)return; window.open(`/api/jobs/${curJobId}/report?top=20`,'_blank'); }

// ================= detail drawer =================
// 把简历全文按段落标题切成结构化块
function parseResumeSections(full){
  if(!full) return [];
  const heads=["求职期望","工作经历","项目经历","教育经历","培训经历","证书","自我评价","语言能力","在校经历"];
  const lines=full.split("\n").map(s=>s.trim()).filter(Boolean);
  const secs=[]; let cur=null;
  for(const ln of lines){
    if(heads.includes(ln)){ cur={title:ln,lines:[]}; secs.push(cur); }
    else if(cur){ cur.lines.push(ln); }
  }
  return secs;
}
function renderResume(full){
  const secs=parseResumeSections(full);
  if(!secs.length) return '';
  return `<div class="dsec"><h4>完整简历</h4><div class="resume-full">`+
    secs.map(s=>{
      // 工作经历/项目/教育 每行一块；求职期望标签化
      if(s.title==='求职期望'){
        return `<div class="rsec"><div class="rsec-t">${s.title}</div><div class="prof-tags">${s.lines.filter(l=>l!=='展开').map(l=>`<span class="tag">${l}</span>`).join('')}</div></div>`;
      }
      const body=s.lines.map(l=>{
        // 时间段/薪资 淡化
        const em=/^\d{4}\.\d{2}|至今|至今|个月|年\)|元\/月|万\/月|千\/月|空档期/.test(l);
        return `<div class="rline ${em?'em':''}">${l}</div>`;
      }).join('');
      return `<div class="rsec"><div class="rsec-t">${s.title}</div>${body}</div>`;
    }).join('')+`</div></div>`;
}

// 结构化简历渲染（有 parsed_resume 时优先）
function renderStructuredResume(pr){
  if(!pr) return '';
  let h='';
  if(pr.expectation){
    const e=pr.expectation;
    h+=`<div class="rsec"><div class="rsec-t">求职期望</div><div class="prof-tags">
      ${e.location?`<span class="tag">${e.location}</span>`:''}${e.title?`<span class="tag">${e.title}</span>`:''}${e.salary?`<span class="tag">${e.salary}</span>`:''}${e.industry?`<span class="tag c">${e.industry}</span>`:''}</div></div>`;
  }
  if(pr.work&&pr.work.length){
    h+=`<div class="rsec"><div class="rsec-t">工作经历</div>`+pr.work.map(w=>`
      <div class="work-card">
        <div class="work-head"><span class="work-co">${w.company||'—'}</span>
          <span class="work-period">${w.period||''}${w.salary?(' · '+w.salary):''}</span></div>
        ${w.title?`<div class="work-title">${w.title}</div>`:''}
        ${w.tags&&w.tags.length?`<div class="prof-tags" style="margin-top:5px">${w.tags.slice(0,6).map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
        ${w.description?`<div class="work-desc">${w.description}</div>`:''}
      </div>`).join('')+`</div>`;
  }
  if(pr.education&&pr.education.length){
    h+=`<div class="rsec"><div class="rsec-t">教育经历</div>`+pr.education.map(e=>`
      <div class="work-card"><div class="work-head"><span class="work-co">${e.school||'—'}</span><span class="work-period">${e.period||''}</span></div>
      <div class="work-title">${[e.major,e.degree].filter(Boolean).join(' · ')}</div></div>`).join('')+`</div>`;
  }
  if(pr.certificates&&pr.certificates.length){
    h+=`<div class="rsec"><div class="rsec-t">证书</div><div class="prof-tags">${pr.certificates.map(x=>`<span class="tag c">${x}</span>`).join('')}</div></div>`;
  }
  if(pr.advantages){
    h+=`<div class="rsec"><div class="rsec-t">个人优势</div><div class="work-desc">${pr.advantages.slice(0,500)}</div></div>`;
  }
  return h?`<div class="dsec"><h4>完整简历</h4><div class="resume-full">${h}</div></div>`:'';
}

async function openDrawer(id){
  const r=await api(`/api/candidates/${id}`);
  if(!r.ok){toast('加载失败');return}
  const c=r.candidate, ev=c.evidence||{};
  $('drawerMask').classList.add('show');
  const d=$('drawer'); d.classList.add('show');
  const R=27,C=2*Math.PI*R,off=C*(1-Math.min(100,c.score)/100);
  const color=c.status==='PASS'?'var(--green)':c.status==='REVIEW'?'var(--amber)':'var(--red)';
  const reasonLi=(c.reasons||[]).map(x=>{
    const neg=/超出|低于|不符|未确认|缺失|无法确认/.test(x);
    return `<li class="${neg?'neg':'pos'}">${x}</li>`;
  }).join('');
  const matchedCerts=(ev.matched_certificates||[]);
  const tl=(c.follow_ups||[]).slice(0,8).map(f=>`<div class="ti">${String(f.created_at||'').slice(5,16)} · ${f.action?.startsWith('STAGE:')?('流转为「'+ (STAGE_CN[f.action.slice(6)]||f.action.slice(6)) +'」'):f.action}${f.note?(' · '+f.note):''}</div>`).join('');
  d.innerHTML=`
    <div class="drawer-head">
      <div class="avatar ${avClass(c.status)}">${(c.name||'?')[0]}</div>
      <div><div class="n">${c.name} <span class="stag ${c.status}">${STATUS_CN[c.status]}</span></div><div class="t">${c.title||'—'}</div></div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body">
      <div class="dsec">
        <div class="score-box">
          <div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="${R}" fill="none" stroke="#eceff4" stroke-width="5"/>
            <circle cx="32" cy="32" r="${R}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
            <div class="num" style="color:${color}">${c.score}<small>匹配分</small></div></div>
          <div class="score-break">
            <div>命中技能：<span class="bhit">${(ev.title_hits&&ev.title_hits.length)?ev.title_hits.join('、'):'—'}</span></div>
            <div>持证：<span class="${matchedCerts.length?'bhit':'bmiss'}">${matchedCerts.length?matchedCerts.join('、'):'未在卡片体现'}</span></div>
            <div>薪资匹配：<span class="${ev.salary_state==='fit'||ev.salary_state==='below'?'bhit':(ev.salary_state==='over'||ev.salary_state==='way_over')?'bmiss':''}">${ev.salary_state==='fit'?'在预算内':ev.salary_state==='below'?'低于预算(性价比高)':ev.salary_state==='over'?'略高于预算':ev.salary_state==='way_over'?'明显高于预算':'未知'}</span></div>
            <div>学历/经验/年龄：${c.education||'—'} · ${c.experience||'—'} · ${c.age?c.age+'岁':'—'}</div>
          </div>
        </div>
      </div>
      <div class="dsec"><h4>基本信息</h4><div class="kv">
        <div class="item"><div class="k">工作城市</div><div class="v">${c.location||'—'}</div></div>
        <div class="item"><div class="k">期望薪资</div><div class="v">${c.salary||'—'}</div></div>
        <div class="item"><div class="k">学历</div><div class="v">${c.education||'—'}</div></div>
        <div class="item"><div class="k">经验</div><div class="v">${c.experience||'—'}</div></div>
        <div class="item"><div class="k">年龄</div><div class="v">${c.age?c.age+'岁':'—'}</div></div>
        <div class="item"><div class="k">在职状态</div><div class="v">${c.activity||'—'}</div></div>
      </div></div>
      ${c.skills?`<div class="dsec"><h4>技能标签</h4><div class="prof-tags">${c.skills.split(/[,，、]/).filter(Boolean).slice(0,10).map(s=>`<span class="tag">${s.trim()}</span>`).join('')}</div></div>`:''}
      <div class="dsec"><h4>匹配理由</h4><ul class="reason-list">${reasonLi}</ul></div>
      ${c.parsed_resume?renderStructuredResume(c.parsed_resume):renderResume(c.full_text)}
      <div class="dsec"><h4>招聘流转</h4><div class="stage-btns">
        ${['TO_REVIEW','TALENT_POOL','TO_CONTACT','CONTACTED','INTERVIEW','REJECTED'].map(s=>`<button class="stage-btn ${c.stage===s?'cur':''}" onclick="drawerStage(${c.id},'${s}')">${STAGE_CN[s]}</button>`).join('')}
      </div></div>
      <div class="dsec"><h4>备注与跟进</h4>
        <textarea class="note-area" id="dNote" placeholder="记录沟通要点、面试反馈等…">${c.note||''}</textarea>
        <div style="display:flex;gap:9px;align-items:center;margin-top:9px">
          <label style="font-size:12px;color:var(--mut);white-space:nowrap">下次跟进</label>
          <input type="date" id="dFollow" value="${(c.next_follow_up_at||'').slice(0,10)}" style="border:1px solid var(--line2);border-radius:7px;padding:6px 10px;font-size:13px;font-family:inherit;outline:none">
          <button class="btn btn-pri btn-sm" onclick="saveNote(${c.id})">保存</button>
        </div>
      </div>
      ${tl?`<div class="dsec"><h4>操作记录</h4><div class="timeline">${tl}</div></div>`:''}
    </div>`;
}
function closeDrawer(){ $('drawer').classList.remove('show'); $('drawerMask').classList.remove('show'); }
async function drawerStage(id,stage){ await setCandidateStage(id,stage); openDrawer(id); }
async function saveNote(id){
  const note=$('dNote').value;
  const follow=$('dFollow')?.value||'';
  await api(`/api/candidates/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({note,next_follow_up_at:follow})});
  toast('已保存'); const c=candidates.find(x=>x.id===id); if(c)c.note=note;
}

// ================= create =================
function openCreate(){ $('createMask').classList.add('show'); }
function closeCreate(){ $('createMask').classList.remove('show'); }
function fillDemo(){
  $('cTitle').value='销售经理';
  $('cJd').value='岗位名称：销售经理\n1. 负责华东区大客户销售，完成业绩指标；\n2. 大专及以上学历，1-3年销售经验；\n3. 35岁以下，持C1驾照，有英语四级证书优先；\n4. 薪资8-12K，工作地点上海、杭州。';
  toast('已填充示例');
}
async function doCreate(){
  const title=$('cTitle').value.trim(), jd=$('cJd').value.trim(), keyword=$('cKw').value.trim();
  if(!title){toast('请填写岗位名称');return}
  if(!jd&&!keyword){toast('请填写岗位描述或关键词');return}
  const btn=$('btnCreate'); btn.disabled=true; btn.textContent='解析中…';
  try{
    const r=await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,jd,keyword})});
    if(!r.ok){toast(r.error||'创建失败');return}
    closeCreate(); toast('岗位已创建');
    $('cTitle').value='';$('cJd').value='';$('cKw').value='';
    await loadJobs(); selectJob(r.job_id);
  }finally{btn.disabled=false;btn.textContent='解析并创建'}
}

// refresh sidebar periodically (light)
setInterval(()=>{ if(!running) loadJobs(); }, 8000);

init();
</script>
