[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-workbench"
version = "1.0.0rc1"
description = "Local-first recruitment sourcing and human review workbench"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40,<2",
]

[tool.setuptools]
packages = ["workbench"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
exclude = ["runtime", "dumped", "resources"]
