name: CI

on:
  push:
    branches: [main, "feat/**", "productization/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile production modules
        run: python -m compileall -q workbench workbench_app.py app.py code tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  desktop-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned production dependencies
        run: python -m pip install -r requirements.txt
      - name: Import hardened desktop entrypoint
        run: >-
          python -c "import PySide6; import workbench_app; import workbench.ui;
          import workbench.qt_workspace_runtime; import workbench.delivery_browser;
          import workbench.db_delivery; import workbench.product_profile;
          print('DESKTOP_IMPORT_OK')"
      - name: Run product health check
        run: python -m workbench.healthcheck
