name: Desktop Smoke

on:
  push:
    branches: ["productization/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qt-window-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the Qt window offscreen
        run: >-
          python -c "from PySide6.QtWidgets import QApplication;
          from workbench.qt_ui import RecruitmentWorkbenchWindow;
          app=QApplication([]); window=RecruitmentWorkbenchWindow(':memory:');
          print(window.windowTitle()); window.close()"
