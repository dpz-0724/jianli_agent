name: Desktop Smoke

on:
  push:
    branches: ["productization/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qt-window-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the actual runtime workspace offscreen
        run: >-
          python -c "from PySide6.QtWidgets import QApplication;
          from workbench.qt_workspace_runtime import RecruitmentWorkspaceWindow;
          app=QApplication([]); window=RecruitmentWorkspaceWindow();
          assert window.windowTitle(); window.close(); print('WINDOW_OK')"
      - name: Verify create-job interaction and persistence
        run: python -m unittest discover -s tests_qt -p "test_*.py" -v
