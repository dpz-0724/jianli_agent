name: Package RC

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build tested onedir package with managed Chromium
        shell: cmd
        run: build.bat
      - name: Verify packaged executable exists
        shell: pwsh
        run: |
          $exe = "dist/招聘自动化工作台/招聘自动化工作台.exe"
          if (-not (Test-Path $exe)) { throw "Packaged executable is missing" }
          $zip = "dist/招聘自动化工作台-v0.9.1-Pilot.zip"
          if (-not (Test-Path $zip)) { throw "Release ZIP is missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: RecruitmentWorkbench-v0.9.1-pilot-windows
          path: |
            dist/招聘自动化工作台/**
            dist/招聘自动化工作台-v0.9.1-Pilot.zip
          if-no-files-found: error
          retention-days: 14
